name: 问题报告
description: 报告一个 bug 或异常行为
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ## 先看这一条

        **绝对不要贴订阅链接、uuid、Reality 公钥或密码。** 机场把订阅链接当身份标识，
        贴出来等于把节点交给所有看到这个 issue 的人。

        需要提供配置片段时，请把地址、端口、uuid、公钥全部替换成 `xxxx`。

  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 客户端版本
      description: 界面标题栏或 About 里的版本号
      placeholder: 0.2.0
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 接管方式与路由模式
      options:
        - 系统代理 + 规则分流
        - 系统代理 + 全局代理
        - 系统代理 + 直连
        - 进程级 TUN + 规则分流
        - 进程级 TUN + 全局代理
        - 进程级 TUN + 直连
        - 不确定
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 你做了什么、期望什么、实际发生了什么
      placeholder: |
        我点了「连接」，界面显示已连接，但浏览器打不开 Google。
        常用链接检测里 Google 不可达、Cloudflare 对照组可达。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 内核日志
      description: 界面里「内核日志」面板的内容（**贴之前先检查有没有地址或 uuid**）
      render: shell
    validations:
      required: false

  - type: input
    id: singbox
    attributes:
      label: 内核版本
      description: 终端执行 `<内核路径> version` 的第一行
      placeholder: sing-box version 1.14.3
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我确认上面没有包含任何订阅链接、uuid、公钥或密码
          required: true
        - label: 我已经在界面的「常用链接检测」里跑过一次，并附上了结果
          required: false
